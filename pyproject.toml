[project]
name = "s2s-tools"
version = "0.1.0"
description = "Speech-to-speech pipeline with tool calling: full-duplex Moshi loop, LLM intent routing, and deterministic tool execution."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "moshi-mlx>=0.3.0",
]

[project.scripts]
s2s = "s2s_tools.main:main"
s2s-live = "s2s_tools.live_loop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["s2s_tools"]
